server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: user-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/okit_users}
    username: ${USER_DB_USERNAME:okit_user}
    password: ${USER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/okit}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/okit/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
