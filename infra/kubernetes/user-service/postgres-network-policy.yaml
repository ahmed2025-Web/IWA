apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-postgres-ingress
  labels:
    app.kubernetes.io/name: user-postgres
    app.kubernetes.io/part-of: okit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: user-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
      ports:
        - protocol: TCP
          port: 5432
