services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command:
      - start-dev
      - --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: dev-file
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    mem_limit: 768m

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: okit_users
      POSTGRES_USER: okit_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Define USER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okit_user -d okit_users"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  user-service:
    build:
      context: ./services/user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_DB_URL: jdbc:postgresql://postgres:5432/okit_users
      USER_DB_USERNAME: okit_user
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Define USER_DB_PASSWORD in .env}
      OIDC_ISSUER_URI: http://localhost:8080/realms/okit
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/okit/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8082:8080"
    mem_limit: 512m

  api-gateway:
    build:
      context: ./services/api-gateway
    restart: unless-stopped
    depends_on:
      - user-service
    environment:
      USER_SERVICE_URL: http://user-service:8080
      OIDC_ISSUER_URI: http://localhost:8080/realms/okit
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/okit/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGIN: http://localhost:8081
    ports:
      - "127.0.0.1:8083:8080"
    mem_limit: 512m

volumes:
  keycloak_data:
  postgres_data:
